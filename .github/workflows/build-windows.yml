name: Test and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python regression tests
        run: python -m unittest discover -v
      - name: Browser helper tests
        run: node --experimental-test-isolation=none --test web/tests/*.test.js
      - name: Validate source configuration
        run: python watcher.py --check

  windows:
    name: Build and verify Windows ZIP
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Release tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "from version import APP_VERSION; print(APP_VERSION)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($version); the app would report the wrong version and miss updates."
            exit 1
          fi
      - name: Build clean portable package
        run: python tools/build_windows.py
      - name: Verify batch startup, matching, letters and restart persistence
        run: python tools/verify_windows_bundle.py dist/Jobwatch-Windows.zip
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: dist/Jobwatch-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish versioned Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: dist
      - name: Publish downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Jobwatch-Windows.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Jobwatch-Windows.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Jobwatch $GITHUB_REF_NAME" \
              --notes "Portable Windows 10/11 x64 package. Extract the ZIP and double-click Start Jobwatch.bat; Jobwatch runs in the background without a window and opens in your browser. To update, extract over your old folder: your profile, applications and settings are kept. Python and dependencies are included; fetching jobs requires internet. Stop it, or start it when you sign in to Windows, from Settings > Background."
          fi
