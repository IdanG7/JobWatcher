name: Test and package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python regression tests
        run: python -m unittest discover -v
      - name: Browser helper tests
        run: node --experimental-test-isolation=none --test web/tests/*.test.js
      - name: Validate source configuration
        run: python watcher.py --check

  windows:
    name: Build and verify Windows ZIP
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Release tag matches version.py
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "from version import APP_VERSION; print(APP_VERSION)")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($version); the app would report the wrong version and miss updates."
            exit 1
          fi
      - name: Install Inno Setup (pinned, checksum verified)
        shell: bash
        env:
          INNO_VERSION: "6.7.3"
          INNO_SHA256: "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/innosetup.exe" \
            "https://github.com/jrsoftware/issrc/releases/download/is-${INNO_VERSION//./_}/innosetup-${INNO_VERSION}.exe"
          echo "$INNO_SHA256  $RUNNER_TEMP/innosetup.exe" | sha256sum -c -
          "$RUNNER_TEMP/innosetup.exe" //VERYSILENT //SUPPRESSMSGBOXES //CURRENTUSER //PORTABLE=1 //NOICONS "//DIR=$(cygpath -w "$RUNNER_TEMP/inno")"
          echo "ISCC=$(cygpath -w "$RUNNER_TEMP/inno/ISCC.exe")" >> "$GITHUB_ENV"
      - name: Build clean installer and portable package
        run: python tools/build_windows.py --installer
      - name: Verify batch startup, matching, letters and restart persistence
        run: python tools/verify_windows_bundle.py dist/Jobwatch-Windows.zip
      - name: Verify install, start, upgrade in place and uninstall
        shell: bash
        run: python tools/verify_windows_installer.py dist/Jobwatch-Setup-*.exe
      - name: Upload Windows package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-package
          path: |
            dist/Jobwatch-Setup-*.exe
            dist/Jobwatch-Windows.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish versioned Windows release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-package
          path: dist
      - name: Publish installer and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Jobwatch-Setup-*.exe dist/Jobwatch-Windows.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Jobwatch-Setup-*.exe dist/Jobwatch-Windows.zip \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Jobwatch $GITHUB_REF_NAME" \
              --notes "Windows 10/11 x64. Download Jobwatch-Setup and run it; no administrator rights are needed. Windows may show 'Windows protected your PC' because the installer is not code-signed: choose More info, then Run anyway. Jobwatch opens in your browser and keeps running in the background; open it again from the Start menu. Your profile, applications and settings are kept across updates and reinstalls. Prefer no installer? Jobwatch-Windows.zip still works: extract it and double-click Start Jobwatch.bat."
          fi
