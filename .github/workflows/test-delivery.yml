name: test delivery
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: send scenario demo to all channels
        env:
          DISCORD_WEBHOOK_APPLY_INTERN: ${{ secrets.DISCORD_WEBHOOK_APPLY_INTERN }}
          DISCORD_WEBHOOK_APPLY_FULLTIME: ${{ secrets.DISCORD_WEBHOOK_APPLY_FULLTIME }}
          DISCORD_WEBHOOK_INTERN: ${{ secrets.DISCORD_WEBHOOK_INTERN }}
          DISCORD_WEBHOOK_FULLTIME: ${{ secrets.DISCORD_WEBHOOK_FULLTIME }}
        run: python watcher.py --test shaun
